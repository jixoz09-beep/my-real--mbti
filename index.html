
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 포켓몬 찾기</title>

  <style>
    /* 기본 색상 */
    :root {
      --cream: #fff9e9;
      --cream-dark: #fff0cc;
      --yellow: #ffd96a;
      --yellow-dark: #f4be38;
      --orange: #e99b32;
      --brown: #59452e;
      --text: #41382d;
      --muted: #857762;
      --white: #ffffff;
      --border: #f0e2c6;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        "Malgun Gothic",
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 10% 8%,
          rgba(255, 223, 135, 0.35),
          transparent 25%
        ),
        radial-gradient(
          circle at 90% 30%,
          rgba(255, 231, 173, 0.4),
          transparent 24%
        ),
        var(--cream);
      line-height: 1.65;
    }

    button {
      font: inherit;
    }

    button:focus-visible {
      outline: 3px solid var(--orange);
      outline-offset: 4px;
    }

    .page {
      width: min(100% - 32px, 920px);
      margin: 0 auto;
      padding: 42px 0 56px;
    }

    /* 상단 소개 */
    .hero {
      text-align: center;
      margin-bottom: 35px;
    }

    .brand {
      display: inline-block;
      padding: 7px 15px;
      border: 1px solid #f3d58c;
      border-radius: 999px;
      background: #fff2cd;
      color: #946820;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .hero-emoji {
      margin: 19px 0 0;
      font-size: 55px;
      line-height: 1.3;
    }

    h1 {
      margin: 7px 0 12px;
      font-size: clamp(30px, 5vw, 46px);
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: -1.8px;
    }

    h1 .highlight {
      color: #d79522;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      word-break: keep-all;
    }

    /* MBTI 선택 영역 */
    .picker {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 12px 35px rgba(127, 95, 40, 0.07);
    }

    .section-heading {
      margin: 0 0 7px;
      text-align: center;
      font-size: 23px;
      font-weight: 900;
    }

    .section-description {
      margin: 0 0 23px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 11px;
    }

    .mbti-button {
      min-height: 62px;
      padding: 14px 5px;
      border: 1.5px solid #eee1c8;
      border-radius: 15px;
      background: #fffdf7;
      color: var(--brown);
      font-size: 19px;
      font-weight: 900;
      cursor: pointer;
      transition:
        transform 0.18s ease,
        background 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .mbti-button:hover {
      transform: translateY(-3px);
      border-color: var(--yellow-dark);
      background: #fff4d4;
      box-shadow: 0 5px 12px rgba(160, 116, 35, 0.1);
    }

    .mbti-button.selected {
      border-color: var(--yellow-dark);
      background: var(--yellow);
      color: #553b12;
    }

    /* 결과 영역 */
    .result {
      margin-top: 28px;
      animation: appear 0.35s ease;
    }

    .result.hidden {
      display: none;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-card {
      overflow: hidden;
      border: 1px solid #f0d79d;
      border-radius: 28px;
      background: var(--white);
      box-shadow: 0 14px 35px rgba(127, 95, 40, 0.09);
    }

    .result-top {
      padding: 29px 22px 25px;
      background:
        radial-gradient(
          circle at 85% 20%,
          rgba(255, 255, 255, 0.7),
          transparent 25%
        ),
        linear-gradient(135deg, #ffe89f, #fff1c8);
      text-align: center;
    }

    .result-label {
      display: inline-block;
      padding: 6px 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.75);
      color: #92631d;
      font-size: 13px;
      font-weight: 800;
    }

    .pokemon-emoji {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 160px;
      height: 160px;
      margin: 13px auto 5px;
      border: 5px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.58);
      font-size: 94px;
      line-height: 1;
      box-shadow: 0 7px 18px rgba(156, 112, 29, 0.1);
    }

    .pokemon-name {
      margin: 10px 0 2px;
      font-size: 35px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .pokemon-type {
      margin: 0;
      color: #81653b;
      font-size: 16px;
      font-weight: 700;
    }

    .result-content {
      padding: 26px;
    }

    .info-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      font-size: 19px;
      font-weight: 900;
    }

    .reason-box {
      padding: 17px 19px;
      border-radius: 17px;
      background: #fff9eb;
    }

    .reason-box p {
      margin: 0;
      font-size: 16px;
      line-height: 1.9;
      word-break: keep-all;
    }

    .reason-box p + p {
      margin-top: 4px;
    }

    .compatibility {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 22px;
      padding: 18px;
      border: 1px solid #f1e3c7;
      border-radius: 18px;
      background: #fffdf8;
    }

    .compatibility-emoji {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: #ffedbd;
      font-size: 27px;
    }

    .compatibility h3 {
      margin: 0 0 3px;
      font-size: 16px;
      font-weight: 900;
    }

    .compatibility p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      word-break: keep-all;
    }

    .compatibility-type {
      display: inline-block;
      margin-right: 5px;
      color: #b77b16;
      font-size: 18px;
      font-weight: 900;
    }

    .reset-button {
      display: block;
      width: 100%;
      margin-top: 22px;
      padding: 15px 20px;
      border: 0;
      border-radius: 16px;
      background: var(--yellow);
      color: #523a14;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      transition:
        transform 0.18s ease,
        background 0.18s ease;
    }

    .reset-button:hover {
      transform: translateY(-2px);
      background: #ffcf4b;
    }

    .footnote {
      margin: 25px 0 0;
      text-align: center;
      color: #978972;
      font-size: 12px;
    }

    .hidden {
      display: none !important;
    }

    /* 작은 화면 */
    @media (max-width: 600px) {
      .page {
        width: min(100% - 22px, 480px);
        padding-top: 27px;
      }

      .hero {
        margin-bottom: 25px;
      }

      .hero-emoji {
        font-size: 46px;
      }

      .hero p {
        font-size: 14px;
      }

      .picker {
        padding: 20px 14px;
        border-radius: 22px;
      }

      .section-heading {
        font-size: 20px;
      }

      .mbti-grid {
        gap: 8px;
      }

      .mbti-button {
        min-height: 55px;
        border-radius: 12px;
        font-size: 17px;
      }

      .result-top {
        padding: 24px 14px 21px;
      }

      .pokemon-emoji {
        width: 135px;
        height: 135px;
        font-size: 80px;
      }

      .pokemon-name {
        font-size: 30px;
      }

      .result-content {
        padding: 19px 15px;
      }

      .reason-box {
        padding: 14px;
      }

      .reason-box p {
        font-size: 15px;
      }

      .compatibility {
        align-items: flex-start;
        gap: 11px;
        padding: 14px 11px;
      }

      .compatibility-emoji {
        width: 45px;
        height: 45px;
        font-size: 23px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="hero">
      <div class="brand">MY MBTI × POKÉMON</div>
      <div class="hero-emoji" aria-hidden="true">🌼 ⚡ 🌼</div>

      <h1>
        나와 닮은 <span class="highlight">포켓몬</span> 찾기!
      </h1>

      <p>
        나의 MBTI를 선택하고<br>
        나와 꼭 어울리는 포켓몬을 만나 보세요.
      </p>
    </header>

    <section class="picker" aria-labelledby="picker-title">
      <h2 class="section-heading" id="picker-title">
        나는 어떤 유형일까?
      </h2>

      <p class="section-description">
        아래에서 나의 MBTI를 하나 골라 주세요!
      </p>

      <div
        class="mbti-grid"
        id="mbtiGrid"
        aria-label="MBTI 유형 선택"
      >
        <!-- MBTI 버튼은 자바스크립트에서 생성됩니다. -->
      </div>
    </section>

    <section
      class="result hidden"
      id="result"
      aria-live="polite"
      aria-atomic="true"
    >
      <div class="result-card">
        <div class="result-top">
          <span class="result-label" id="resultLabel">
            당신과 어울리는 포켓몬
          </span>

          <div
            class="pokemon-emoji"
            id="pokemonEmoji"
            role="img"
            aria-label="포켓몬을 나타내는 이모지"
          >
            ⚡
          </div>

          <h2 class="pokemon-name" id="pokemonName">
            피카츄
          </h2>

          <p class="pokemon-type" id="pokemonType">
            ENFP와 어울리는 포켓몬
          </p>
        </div>

        <div class="result-content">
          <h3 class="info-title">
            <span aria-hidden="true">💛</span>
            <span>왜 나와 어울릴까?</span>
          </h3>

          <div class="reason-box">
            <p id="reason1"></p>
            <p id="reason2"></p>
          </div>

          <div class="compatibility">
            <div class="compatibility-emoji" aria-hidden="true">
              🤝
            </div>

            <div>
              <h3>나와 잘 맞는 MBTI</h3>
              <p>
                <span class="compatibility-type" id="compatibilityType">
                  INTJ
                </span>
                <span id="compatibilityDescription">
                  서로 다른 매력으로 균형을 이루는 유형!
                </span>
              </p>
            </div>
          </div>

          <button
            type="button"
            class="reset-button"
            id="resetButton"
          >
            ↩ 다시 고르기
          </button>
        </div>
      </div>
    </section>

    <footer class="footnote">
      ※ 포켓몬과 MBTI의 조합은 재미를 위한 가벼운 성격 매칭이에요.
      실제 성격이나 궁합을 과학적으로 판단하는 테스트는 아닙니다.
    </footer>
  </main>

        pokemon: "파치리스",
        emoji: "🐿️",
        reason1: "밝고 활발한 에너지로 주변에 웃음과 즐거움을 전하는 모습이 닮았어요.",
        reason2: "지금 이 순간을 즐기고 사람들과 함께하는 시간을 소중히 여겨요.",
        match: "ISTJ",
        matchDescription: "명랑한 활기와 차분한 안정감이 서로를 채워 줘요."
      }
    ];

    const mbtiGrid = document.getElementById("mbtiGrid");
    const result = document.getElementById("result");
    const resetButton = document.getElementById("resetButton");

    let selectedButton = null;

    // 16가지 MBTI 버튼을 자동으로 만듭니다.
    pokemonData.forEach((item) => {
      const button = document.createElement("button");

      button.type = "button";
      button.className = "mbti-button";
      button.textContent = item.type;
      button.setAttribute("aria-pressed", "false");
      button.setAttribute("aria-label", item.type + " 유형 선택");

      button.addEventListener("click", () => {
        showResult(item, button);
      });

      mbtiGrid.appendChild(button);
    });

    // 선택한 MBTI에 맞는 포켓몬과 궁합을 보여 줍니다.
    function showResult(item, button) {
      if (selectedButton) {
        selectedButton.classList.remove("selected");
        selectedButton.setAttribute("aria-pressed", "false");
      }

      selectedButton = button;
      selectedButton.classList.add("selected");
      selectedButton.setAttribute("aria-pressed", "true");

      document.getElementById("resultLabel").textContent =
        "나와 어울리는 포켓몬";

      document.getElementById("pokemonEmoji").textContent = item.emoji;
      document.getElementById("pokemonEmoji").setAttribute(
        "aria-label",
        item.pokemon + "을(를) 나타내는 이모지"
      );

      document.getElementById("pokemonName").textContent = item.pokemon;
      document.getElementById("pokemonType").textContent =
        item.type + " 유형과 어울리는 포켓몬";

      document.getElementById("reason1").textContent = item.reason1;
      document.getElementById("reason2").textContent = item.reason2;

      document.getElementById("compatibilityType").textContent =
        item.match;

      document.getElementById("compatibilityDescription").textContent =
        item.matchDescription;

      result.classList.remove("hidden");

      result.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    }

    // 결과를 닫고 다시 MBTI를 선택할 수 있게 합니다.
    resetButton.addEventListener("click", () => {
      result.classList.add("hidden");

      if (selectedButton) {
        selectedButton.classList.remove("selected");
        selectedButton.setAttribute("aria-pressed", "false");
        selectedButton = null;
      }

      document.getElementById("picker-title").focus();
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });

    // 키보드 사용자를 위해 선택 영역 제목에 포커스가 갈 수 있도록 합니다.
    document.getElementById("picker-title").setAttribute("tabindex", "-1");
  </script>
</body>
</html>
